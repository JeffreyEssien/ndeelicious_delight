name: CI/CD pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  code-quality:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check changed files
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run quality -- --since="$QUALITY_BASE_SHA"

  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run domain regression suite
        run: npm run test:css && npm run test:regression

  admin-database-tests:
    name: Admin migration and scale checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:admin:db && node scripts/test-preparation-minutes.mjs && node scripts/test-admin-customers.mjs

  isolated-browser-tests:
    name: Isolated admin responsive and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDEE_BROWSER_FIXTURES: 'true'
      PLAYWRIGHT_ISOLATED_ENVIRONMENT: 'true'
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4545
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-key
      SUPABASE_SERVICE_ROLE_KEY: fixture-service-key
      ADMIN_AUTH_SECRET: isolated-ndee-browser-secret-32-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated fixtures and app
        run: |
          node e2e/fixture-server.mjs > /tmp/ndee-fixtures.log 2>&1 &
          npm run dev -- --port 3100 > /tmp/ndee-app.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3100/admin/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ndee-app.log
          exit 1
      - name: Check seven screen widths
        run: npx playwright test e2e/admin-audit.spec.ts e2e/admin-configuration.spec.ts e2e/admin-documents.spec.ts e2e/admin-history.spec.ts e2e/admin-mobile-followup.spec.ts e2e/admin-delta.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-admin-browser-results
          path: |
            test-results/
            playwright-report/

  browser-tests:
    name: Responsive visual and accessibility tests
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser suite against isolated staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          PLAYWRIGHT_ISOLATED_ENVIRONMENT: ${{ vars.E2E_ISOLATED_ENVIRONMENT }}
          PLAYWRIGHT_ADMIN_STORAGE_STATE: ${{ secrets.E2E_ADMIN_STORAGE_STATE }}
          PLAYWRIGHT_QUOTE_RESPONSE_PATH: ${{ secrets.E2E_QUOTE_RESPONSE_PATH }}
          PLAYWRIGHT_DOCUMENT_PATH: ${{ secrets.E2E_DOCUMENT_PATH }}
        run: npm run test:e2e

  functional-tests:
    name: Functional API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run route-level functional suite
        run: npm run test:functional

  structural-tests:
    name: Structural checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build production application
        run: npm run test:structural

  deploy-staging:
    name: Deploy develop to staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      vars.VERCEL_CD_ENABLED == 'true'
    needs: [code-quality, regression-tests, functional-tests, structural-tests, admin-database-tests, isolated-browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate deployment configuration
        run: test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - name: Pull staging environment
        run: npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build staging deployment
        run: npx --yes vercel@latest build --token="$VERCEL_TOKEN"
      - name: Deploy staging build
        run: npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy main to production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.VERCEL_CD_ENABLED == 'true'
    needs: [code-quality, regression-tests, functional-tests, structural-tests, admin-database-tests, isolated-browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate deployment configuration
        run: test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_TOKEN"
      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production deployment
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production build
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
